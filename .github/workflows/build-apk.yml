name: Build APK and AAB

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Aura Music APK and AAB
        run: ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon

      - name: Build Aura Studio Admin APK
        run: ./gradlew :studio:assembleDebug --no-daemon

      - name: Upload Aura Music APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Music-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Aura Music Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Music-Release-AAB
          path: app/build/outputs/bundle/debug/*.aab
          retention-days: 14

      - name: Upload Aura Studio Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Studio-Admin-APK
          path: studio/build/outputs/apk/debug/*.apk
          retention-days: 14
